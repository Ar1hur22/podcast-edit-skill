<!doctype html>
<!-- Worked example template: a number counts up to the figure being spoken, with a short label.
     The pipeline passes every template a "duration" (seconds on screen) so it can fade itself out. -->
<html
  data-composition-variables='[
    {"id":"value","type":"number","label":"Number to count up to","default":75},
    {"id":"decimals","type":"number","label":"Decimal places","default":0},
    {"id":"prefix","type":"string","label":"Before the number","default":""},
    {"id":"suffix","type":"string","label":"After the number","default":"%"},
    {"id":"label","type":"string","label":"Label","default":"of people"},
    {"id":"accent","type":"color","label":"Accent colour","default":"#38BDF8"},
    {"id":"text","type":"color","label":"Text colour","default":"#FFFFFF"},
    {"id":"panel","type":"string","label":"Panel colour (CSS)","default":"rgba(12,14,18,0.62)"},
    {"id":"top","type":"string","label":"Distance from the top (empty = automatic)","default":""},
    {"id":"align","type":"enum","label":"Side","default":"auto","options":[{"value":"auto","label":"Automatic"},{"value":"left","label":"Left"},{"value":"center","label":"Centre"},{"value":"right","label":"Right"}]},
    {"id":"duration","type":"number","label":"Seconds on screen","default":3}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; font-family: Inter, sans-serif; }
        /* Automatic placement keeps clear of a centred face: top left in 16:9, just under the face in 9:16. */
        .sc-wrap { position: absolute; left: 5%; right: 5%; top: 8%; display: flex; justify-content: flex-start; }
        @media (orientation: portrait) { .sc-wrap { top: 49%; justify-content: center; } }
        .sc { padding: 2.2vmin 4.4vmin 2.6vmin; border-radius: 2.4vmin; background: var(--panel); color: var(--text);
              display: flex; flex-direction: column; align-items: center; }
        .sc-num { font-size: 15vmin; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .sc-bar { height: 0.8vmin; width: 100%; margin: 1.6vmin 0 1.4vmin; border-radius: 0.4vmin; background: var(--accent);
                  transform-origin: left center; }
        .sc-label { font-size: 3.6vmin; font-weight: 600; }
      </style>
      <div id="root" data-composition-id="stat-counter">
        <div class="sc-wrap">
          <div class="sc">
            <div class="sc-num">0</div>
            <div class="sc-bar"></div>
            <div class="sc-label" data-var-text="label">of people</div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          // Inside a template HyperFrames scopes document.querySelector and getVariables() to this copy,
          // so the same template can appear several times with different values.
          const v = window.__hyperframes.getVariables();
          const $ = (s) => document.querySelector(s);
          const num = $('.sc-num'), box = $('.sc'), wrap = $('.sc-wrap');
          if (v.top) wrap.style.top = v.top;
          if (v.align && v.align !== 'auto') wrap.style.justifyContent = { left: 'flex-start', center: 'center', right: 'flex-end' }[v.align];
          const show = (x) => (v.prefix || '') + Number(x).toFixed(v.decimals || 0) + (v.suffix || '');
          const count = { n: 0 };
          num.textContent = show(0);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(box, { opacity: 0, y: 24, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: 'power3.out' }, 0);
          tl.to(count, { n: v.value, duration: 1.1, ease: 'power2.out', onUpdate: () => { num.textContent = show(count.n); } }, 0.12);
          tl.fromTo($('.sc-bar'), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'power2.inOut' }, 0.3);
          tl.fromTo($('.sc-label'), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.45);
          tl.to(box, { opacity: 0, y: -12, duration: 0.25, ease: 'power2.in' }, Math.max(0.6, v.duration - 0.25));
          window.__timelines['stat-counter'] = tl;
        })();
      </script>
    </template>
  </body>
</html>
